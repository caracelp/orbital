[package]
name = "orbital-drive"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Sincronización de la bóveda con Google Drive (061): motor, cliente de la API y servidor falso para las pruebas, sin GTK."
publish = false

# Ningún crate nuevo para el proyecto: todos estaban ya en el `Cargo.lock` (libsoup y gio por
# webkit6; serde, md-5, sha2, base64 y getrandom por otras dependencias; similar por la bóveda).
[dependencies]
base64 = "0.22.1"
getrandom = "0.4.3"
gio = "0.22.10"
md-5 = "0.10.6"
orbital-vault = { version = "0.1.0", path = "../orbital-vault" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
similar = "3.2.1"
soup = { package = "soup3", version = "0.9.0" }

[features]
# El servidor falso de la API de Drive (pruebas del crate y de la app; nunca en la app distribuida).
servidor-falso = []

[dev-dependencies]
orbital-drive = { path = ".", features = ["servidor-falso"] }
gio = "0.22.10"
soup = { package = "soup3", version = "0.9.0" }

[[example]]
name = "preparar-prueba"
required-features = ["servidor-falso"]

[[example]]
name = "medir"
required-features = ["servidor-falso"]
