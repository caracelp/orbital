[package]
name = "orbital-vault"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Núcleo de la bóveda de Orbital: lectura, propiedades y escritura segura, sin GTK."
publish = false

[dependencies]
htmd = "0.5.6"
memchr = "2.8"
pdf-extract = "0.12.1"
pulldown-cmark = { version = "0.13.6", default-features = false }
roxmltree = "0.21.2"
saphyr-parser = "0.3.3"
similar = "3.2.1"
xxhash-rust = { version = "0.8.19", default-features = false, features = ["xxh3"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
divan = "0.1.21"

[[bench]]
name = "vault"
harness = false
