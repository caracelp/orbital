# CI de Orbital: las mismas verificaciones que CONTRIBUTING.md, en un contenedor de Arch
# porque webkitgtk-6.0 (WebKitGTK para GTK4) no está en los runners de Ubuntu.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["site/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verificacion:
    name: fmt, clippy, test y deny
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Dependencias (GTK4, libadwaita, WebKitGTK 6.0, GtkSourceView 5, Rust, Xvfb, D-Bus, fuentes y curl)
        run: |
          pacman -Syu --noconfirm \
            curl \
            git \
            gtk4 \
            libadwaita \
            gtksourceview5 \
            webkitgtk-6.0 \
            xorg-server-xvfb \
            dbus \
            cantarell-fonts \
            ttf-dejavu \
            gst-plugins-base \
            gst-plugins-good \
            gst-libav \
            openbox \
            rust

      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Diagnóstico (temporal)
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: |
          dbus-uuidgen --ensure
          cargo build -q --tests --bin orbital
          cat > /tmp/diag.sh <<'FIN'
          openbox >/tmp/openbox.log 2>&1 &
          sleep 2
          for p in editor::ecuaciones_tests::editor_de_ecuaciones_en_codigo editor::galeria_tests::galeria_cuatro_layouts_y_visor editor::galeria_tests::galeria_teclado_y_paginas editor::html::webkit_tests::medios_en_visual_html editor::html::webkit_tests::varios_medios_en_un_renglon_visual_html editor::reader::reader_tests::medios_en_lectura medios::tests::reproductor_carga_al_pedirlo medios::tests::reproductor_se_suelta_al_ocultar_la_vista window::tests::ventana_tests::abre_maximizada_y_vuelve_al_tamano_guardado; do
            echo "=== $p"
            timeout 300 cargo test -q --bin orbital "$p" -- --ignored --exact 2>&1 | grep -v portal | tail -15
          done
          cat /tmp/openbox.log
          FIN
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" sh /tmp/diag.sh

      - name: Formato
        if: false
        run: cargo fmt --all -- --check

      - name: Clippy sin avisos
        if: false
        run: cargo clippy --all-targets -- -D warnings

      # Los tests de GTK necesitan un display: corren bajo Xvfb.
      - name: Tests
        if: false
        run: xvfb-run -a cargo test

      # Las pruebas GTK en proceso (`#[ignore]`): una por proceso, con D-Bus (la app se registra) y
      # sin el sandbox de WebKit (el contenedor no permite los espacios de nombres que usa).
      - name: Pruebas GTK en proceso
        if: false
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: |
          dbus-uuidgen --ensure
          # Pantalla grande: con la de 640×480 por defecto, las barras laterales se pliegan.
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" tools/pruebas-gtk.sh

      - name: Licencias y vulnerabilidades
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - run: cargo deny check
        if: false
