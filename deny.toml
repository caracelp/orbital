# cargo-deny: `cargo deny check`
# Garantiza que todas las dependencias sean compatibles con GPL-3.0-or-later y no tengan vulnerabilidades conocidas.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Falla ante vulnerabilidades (RustSec); avisa de crates sin mantenimiento.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Solo licencias compatibles con GPL-3.0. Las que no aparecen aquí se rechazan.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "GPL-3.0-only",
]

[bans]
# Avisa cuando hay dos versiones del mismo crate (binario más grande y compilación más lenta).
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
