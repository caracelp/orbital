[workspace]
members = ["crates/orbital-vault", "crates/orbital-formulas", "crates/orbital-graficos", "crates/orbital-diagramas", "crates/orbital-drive"]
# `cargo test`, `cargo clippy` y `cargo build` sin `-p` cubren la app y el núcleo.
default-members = [".", "crates/orbital-vault", "crates/orbital-formulas", "crates/orbital-graficos", "crates/orbital-diagramas", "crates/orbital-drive"]
resolver = "3"

[package]
name = "orbital"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
orbital-diagramas = { version = "0.1.0", path = "crates/orbital-diagramas" }
orbital-formulas = { version = "0.1.0", path = "crates/orbital-formulas" }
orbital-graficos = { version = "0.1.0", path = "crates/orbital-graficos" }
orbital-vault = { version = "0.1.0", path = "crates/orbital-vault" }
sourceview5 = "0.11.2"
webkit6 = "0.6.1"
gstreamer = { version = "0.25", default-features = false }
# Canal de un solo uso (060): ya lo compilan glib y gio, no suma compilación.
futures-channel = "0.3.34"

# Máximo rendimiento en las compilaciones de release
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Los benchmarks heredan el perfil de release (Cargo los compila siempre con unwind).
[profile.bench]
inherits = "release"
strip = false
